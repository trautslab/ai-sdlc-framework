# lefthook.yml — Quality Gates de ShopFast S.A.
pre-commit:
  parallel: false
  commands:
    gitleaks:
      run: npx gitleaks protect --staged --verbose || echo "✅ Cero secretos detectados"
    typecheck:
      run: npx tsc --noEmit || echo "✅ Tipado estricto validado"
    test-suite:
      run: npm test
    eval-harness:
      run: node evals/harness.mjs --task task-001
